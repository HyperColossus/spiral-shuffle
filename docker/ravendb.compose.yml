# Separate, optional RavenDB service for Spiral Shuffle.
# DO NOT add this to any existing bot/web Docker Compose project.
# Explicitly bound to 127.0.0.1:18080: database is never internet-facing.
name: spiral-shuffle-ravendb
services:
  database:
    image: ravendb/ravendb:7.2.6-ubuntu.24.04-x64
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      RAVEN_Setup_Mode: "None"
      # RavenDB treats an all-interface container bind (0.0.0.0) as PublicNetwork.
      # This disables database authentication inside the isolated Docker network.
      # CRITICAL: KEEP the host port published to 127.0.0.1 ONLY; never expose it.
      RAVEN_Security_UnsecuredAccessAllowed: "PublicNetwork"
      RAVEN_ServerUrl: "http://0.0.0.0:18080"
      # PublicServerUrl must be reachable by this single node from WITHIN
      # its own network namespace. Use the same HTTP port inside and out.
      RAVEN_PublicServerUrl: "http://127.0.0.1:18080"
    volumes:
      - spiral_data:/var/lib/ravendb/data

volumes:
  spiral_data:
