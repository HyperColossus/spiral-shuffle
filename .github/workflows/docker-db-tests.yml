name: Docker DB and portal guard checks

on:
  push:
    paths:
      - 'docker/**'
      - 'portal_api.py'
      - 'portal_bridge.py'
      - 'PortalRegistration.cs'
      - 'tests/portal-bridge-tests/**'
      - 'portal_access.py'
      - 'portal/**'
      - 'docs/index.html'
      - 'tests/test_portal_access.py'
      - 'tests/portal_ui.mjs'
      - 'tests/test_docker_db.py'
      - 'tests/test_portal_api.py'
      - '.github/workflows/docker-db-tests.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'portal_api.py'
      - 'portal_bridge.py'
      - 'PortalRegistration.cs'
      - 'tests/portal-bridge-tests/**'
      - 'portal_access.py'
      - 'portal/**'
      - 'docs/index.html'
      - 'tests/test_portal_access.py'
      - 'tests/portal_ui.mjs'
      - 'tests/test_docker_db.py'
      - 'tests/test_portal_api.py'
      - '.github/workflows/docker-db-tests.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax checks
        run: python3 -m py_compile docker/db_config.py portal_api.py portal_bridge.py portal_access.py portal/access_firewall.py tests/test_docker_db.py tests/test_portal_api.py tests/test_portal_access.py
      - name: Docker Compose validation (no container startup)
        run: docker compose -f docker/ravendb.compose.yml config --quiet
      - name: Test migration safeguards
        run: python3 -m unittest discover -s tests -p 'test_docker_db.py' -v
      - name: Test registration validation
        run: python3 -m unittest discover -s tests -p 'test_portal*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test website access controls (offline DOM harness)
        run: node tests/portal_ui.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test actual credential bridge with in-memory persistence
        run: dotnet run --project tests/portal-bridge-tests/PortalBridgeTests.csproj -c Release
