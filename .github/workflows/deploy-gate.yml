name: Spiral deployment gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile operations and API
        run: python3 -m py_compile auto_deploy.py service_runtime.py install_services.py portal_api.py portal_access.py portal_bridge.py
      - name: Validate portal and deployment safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_portal*.py' -v
          python3 -m unittest discover -s tests -p 'test_operations.py' -v
          python3 -m unittest discover -s tests -p 'test_docker_db.py' -v
      - name: Validate website interactions
        run: node tests/portal_ui.mjs
      - name: Validate reward service attachment lifecycle
        run: dotnet run --project tests/spell-reward-lifecycle-tests/RewardLifecycleTests.csproj -c Release
      - name: Compile and test credential bridge
        run: dotnet run --project tests/portal-bridge-tests/PortalBridgeTests.csproj -c Release
      - name: Validate service unit syntax
        run: |
          for unit in portal/spiral-shuffle-*.service portal/spiral-shuffle-*.timer; do
            sed -e 's|@ROOT@|/opt/spiral-shuffle|g' -e 's|@DATA_DIR@|/var/lib/spiral-shuffle|g' "$unit" > "/tmp/$(basename "$unit")"
          done
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin spiral-shuffle || true
          sudo mkdir -p /opt/spiral-shuffle /var/lib/spiral-shuffle/runtime/live-dashboard
          sudo cp *.py /opt/spiral-shuffle/
          sudo touch /var/lib/spiral-shuffle/runtime/live-dashboard/dashboard.py
          systemd-analyze verify --man=no /tmp/spiral-shuffle-*.service /tmp/spiral-shuffle-*.timer
          sudo visudo -cf portal/spiral-shuffle-logs.sudoers
          sh -n portal/spiral-shuffle-logs
